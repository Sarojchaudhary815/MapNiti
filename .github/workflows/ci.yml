name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mapniti-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # same as the Docker image
          cache: pip
          cache-dependency-path: mapniti-backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # tests use a throw-away SQLite database; no secrets, MySQL or Earth Engine needed
      - run: python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (errors fail the build)
        run: npx eslint --ext .js,.jsx --quiet src
      - name: Unit tests
        run: npx react-scripts test --watchAll=false
      - name: Production build
        run: npm run build
        env:
          CI: false   # don't turn the remaining lint warnings into build errors

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Images build
        run: docker compose build
